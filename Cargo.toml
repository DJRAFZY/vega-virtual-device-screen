[package]
name = "vvd-screen"
version = "0.1.0"
edition = "2021"
description = "Live 60fps screen stream for the Amazon Vega Virtual Device (VVD) over localhost HTTP, via the emulator gRPC streamScreenshot API."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "process", "io-util", "signal"] }
tonic = "0.12"
prost = "0.13"
axum = "0.7"
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-stream = "0.3"
futures-core = "0.3"
jpeg-encoder = { version = "0.6", features = ["simd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
